# Local development stack.
#   Infrastructure only (then run `npm run dev`):  docker compose up -d postgres redis mailpit
#   Everything in containers:                      docker compose up -d --build
# Values come from .env (copy .env.example).  App: http://localhost:8080   Test inbox: http://localhost:8025

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-careeros}:${POSTGRES_PASSWORD:-careeros_dev_password}@postgres:5432/${POSTGRES_DB:-careeros_dev}
  REDIS_URL: redis://redis:6379
  SMTP_HOST: mailpit
  SMTP_PORT: '1025'
  SMTP_USER: ''
  FRONTEND_URL: http://localhost:8080
  APP_URL: http://localhost:8080
  CORS_ORIGINS: http://localhost:8080
  STORAGE_LOCAL_PATH: /app/uploads
  # Plain-HTTP localhost, so the refresh cookie can't be marked Secure here
  COOKIE_SECURE: 'false'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careeros_dev}
      POSTGRES_USER: ${POSTGRES_USER:-careeros}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careeros_dev_password}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Catches every email the app sends (password reset, confirmations, reminders) so you can
  # read them at http://localhost:8025 without a real mail account.
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: careeros-api:dev
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment: *app-env
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: careeros-api:dev
    command: ['worker']
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment: *app-env
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  uploads:
